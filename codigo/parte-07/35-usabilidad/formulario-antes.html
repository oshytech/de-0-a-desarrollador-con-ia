<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Reserva (versión con problemas)</title>
  <style>
    input, select { display: block; margin: 8px 0; font-size: 12px; color: #aaaaaa; }
    .boton { background: #7fb3ff; color: #ffffff; padding: 8px; width: 120px; cursor: pointer; }
    *:focus { outline: none; }
  </style>
</head>
<body>
  <!-- Ejemplo de lo que NO hay que hacer. La versión corregida está en
       codigo/parte-07/36-ojos-para-los-agentes/public/index.html -->
  <h3>Reserva</h3>
  <input id="correo" placeholder="Correo">
  <select id="pista">
    <option>Tenis 1</option>
    <option>Tenis 2</option>
    <option>Pádel 1</option>
  </select>
  <input id="dia" placeholder="Día (dd/mm/aaaa)">
  <input id="hora" placeholder="Hora">
  <div class="boton" onclick="enviar()">Enviar</div>
  <div id="mensaje"></div>
  <script>
    function enviar() {
      const hora = document.getElementById("hora").value;
      const valida = /^([01]\d|2[0-3]):00$/.test(hora) && hora >= "08:00" && hora <= "21:00";
      document.getElementById("mensaje").textContent = valida ? "OK" : "Error 422: datos no válidos";
    }
  </script>
</body>
</html>
