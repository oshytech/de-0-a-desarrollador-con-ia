# Proyecto de Xcode descrito como texto. Se genera con XcodeGen:
#   cd iosApp && xcodegen generate
# El .xcodeproj resultante no se sube al repositorio.
name: iosApp
options:
  bundleIdPrefix: club.reservas
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    # La fase que llama a Gradle necesita leer y escribir fuera del proyecto de Xcode.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  iosApp:
    type: application
    platform: iOS
    sources: [iosApp]
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Reservas
        UILaunchScreen: {}
        # Compose Multiplatform lo pide para animar a 120 Hz en los iPhone que lo admiten.
        CADisableMinimumFrameDurationOnPhone: true
        # Permite llamar a la API local por http:// (solo red local, no Internet).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.reservas.ios
        PRODUCT_NAME: Reservas
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
    preBuildScripts:
      - name: Compilar el módulo shared
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          # Xcode no hereda las variables de la terminal: si no hay JAVA_HOME, se busca un JDK 17 o posterior.
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home -v 17+ 2>/dev/null)}"
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
