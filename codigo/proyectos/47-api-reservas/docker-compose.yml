# PostgreSQL para desarrollo local. Las credenciales son de mentira y solo
# sirven en tu ordenador: en cualquier otro entorno van en un gestor de secretos.
# El esquema no se crea aquí: lo crean las migraciones al arrancar la API.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: reservas
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: reservas_local
    ports:
      # Solo en 127.0.0.1: la base de datos no queda expuesta a tu red.
      - "127.0.0.1:${PUERTO_POSTGRES:-5432}:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservas -d reservas"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  datos:
