# Integración y entrega continuas de la API de reservas.
# Se coloca en .github/workflows/ de un repositorio cuya raíz es el código
# del capítulo 38 (go.mod, cmd/, internal/, migraciones/, Dockerfile).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: club
          POSTGRES_PASSWORD: solo-para-ci
          POSTGRES_DB: club
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U club"
          --health-interval 2s
          --health-retries 15
    env:
      RESERVAS_BD: postgres://club:solo-para-ci@localhost:5432/club?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formato
        run: test -z "$(gofmt -l .)"
      - name: Análisis estático
        run: go vet ./...
      - name: Tests (unitarios y de integración con PostgreSQL)
        run: go test -race ./...

  imagen:
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Entrar en el registro (solo al publicar)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y, con una etiqueta v*, publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  desplegar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: imagen
    runs-on: ubuntu-latest
    environment: produccion # en GitHub se configura con aprobación manual
    steps:
      - name: Comprobar que el secreto existe
        env:
          TOKEN: ${{ secrets.MANIFIESTOS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta el secreto MANIFIESTOS_TOKEN"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: ejemplo/reservas-manifiestos
          token: ${{ secrets.MANIFIESTOS_TOKEN }}
      - name: Apuntar producción a la nueva imagen
        env:
          IMAGEN: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          sed -i "s|image: ghcr.io/.*/reservas-api:.*|image: ${IMAGEN}|" produccion/deployment.yaml
          git config user.name "ci"
          git config user.email "ci@ejemplo.org"
          git commit -am "produccion: reservas-api ${GITHUB_REF_NAME}"
          git push
